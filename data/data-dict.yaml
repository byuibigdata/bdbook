relationships:
  - join: payments.PAYMENT_ID = shopper_id.PAYMENT_ID
    cardinality: one-to-one
    description: >
      Each tender has at most one shopper identity. This is the safe way to
      attach a shopper, because it does not multiply rows.

  - join: transaction_items.GTIN = master_gtin.GTIN
    cardinality: many-to-one
    description: >
      Attaches a category to a scanned item. A left join is required: 12%
      of scanned lines have no match, and non-scanned lines never will.

  - join: transaction_items.STORE_ID = stores_information.STORE_ID
    cardinality: many-to-one
    description: Attaches store geography and panel start dates to a line item.

  - join: payments.STORE_ID = stores_information.STORE_ID
    cardinality: many-to-one
    description: Attaches store attributes to a payment.

  - join: discounts.STORE_ID = stores_information.STORE_ID
    cardinality: many-to-one
    description: Attaches store attributes to a discount.

  - join: discounts.TRANSACTION_ITEM_ID = transaction_items.TRANSACTION_ITEM_ID
    cardinality: many-to-one
    description: >
      A line item may carry several discounts, so aggregate discounts to
      the line before joining back.
    conflicts: [STORE_ID, DATE_TIME, GRAND_TOTAL_AMOUNT]

  - join: stores_status.STORE_ID = stores_information.STORE_ID
    cardinality: one-to-one
    description: >
      The same stores in both tables. Select only `ACTIVE_STATUS` and
      `STORE_FLAG` from `stores_status`; everything else is duplicated.
    conflicts: [STORE_NAME, STORE_CHAIN_ID, STORE_CHAIN_NAME, CHAIN_SIZE, STREET_ADDRESS, CITY, STATE, ZIP_CODE, LATITUDE, LONGITUDE, START_DATE, START_WEEK_CONTINUOUS_DATA, CREATED_AT, UPDATED_AT]

glossary:
  basket: >
    The set of items bought together. Here it means the items sharing a
    `TRANSACTION_SET_ID` — one register ring-up.

  visit: >
    One trip to the store by one shopper, which may span several
    transactions. At a convenience store the pump and the counter are
    usually rung up separately, so a visit is reconstructed by grouping
    transactions with the same shopper and store within a short time
    window (30 minutes is the usual choice). A visit is the right grain
    for any question about what people buy alongside fuel; a transaction
    is not.

  GTIN: >
    Global Trade Item Number — the number encoded in a product's barcode.
    Zero-padded to 14 digits here, which means a UPC-A barcode carries two
    leading zeros.

  PLU: >
    Price Look-Up code: a short number typed at the register for items
    that are not scanned, such as loose goods.

  non-scan: >
    A line keyed to a department rather than scanned — fuel, lottery,
    foodservice, fees. It has no real barcode, so its category comes from
    `NONSCAN_CATEGORY` rather than the product master.

  attach rate: >
    The share of fuel visits that also include an in-store purchase. At
    the transaction grain this is misleadingly low, because the pump and
    the counter are separate transactions; it has to be measured at the
    visit grain.

  fleet card: >
    A fuel card issued to a business for its vehicles, shown as
    `CARD_TYPE = WX`. Fleet transactions are company purchases rather than
    personal shopping, so they behave differently and may deserve
    exclusion from customer-level models.

  panel: >
    The set of stores that report data to PDI. A store joins on
    `START_DATE` and becomes reliable on `START_WEEK_CONTINUOUS_DATA`.
    Because stores join over time, raw totals rise even when sales per
    store do not. PDI's panel covers roughly 80% of the independent
    convenience-store market; large chains such as 7-Eleven, Buc-ee's and
    Pilot are excluded by data rights, so this is independents only.

  t-log: >
    Transaction log — the raw file a point-of-sale system writes for every
    sale. Every row in this dataset was parsed from one. The four
    supported vendors (Verifone, Gilbarco, Clover, NCR) each write their
    own format, which is why some columns are populated for one vendor
    only and free-text columns vary so much between stores.

  NACS: >
    The National Association of Convenience Stores, whose product
    taxonomy labels the keyed, non-scanned lines
    (`NONSCAN_CATEGORY` and friends). Distinct from PDI's own taxonomy in
    `master_gtin.CATEGORY` — the two are different vocabularies and should
    be reconciled before being combined.

  BIN: >
    Bank Identification Number — the first six digits of a payment card,
    identifying the issuer. PDI hashes it with the card's last four digits
    and the store's state to build `SHOPPER_ID`.

  identity resolution: >
    PDI's method for recognising a repeat customer without storing
    personal data. Here it is a hash of card BIN, card last four, and
    store state. It is approximate in both directions: one person can
    become several shoppers (two cards, or two states), and two people can
    collide into one.
